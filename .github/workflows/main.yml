name: Capture Public API Endpoints

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Create capture script
        run: |
          cat > capture.js <<'EOF'
          const { chromium } = require("playwright");
          const fs = require("fs");

          const TARGET =
            "https://toffeelive.com/en/watch/wHLVIJ4B7a1HdMSjaGLJ";

          const sensitive = new Set([
            "authorization",
            "cookie",
            "set-cookie",
            "proxy-authorization",
            "x-api-key",
            "x-auth-token"
          ]);

          function sanitize(headers) {
            const result = {};

            for (const [key, value] of Object.entries(headers)) {
              result[key] =
                sensitive.has(key.toLowerCase())
                  ? "[REDACTED]"
                  : value;
            }

            return result;
          }

          async function main() {
            console.log("Opening:", TARGET);

            const browser = await chromium.launch({
              headless: true
            });

            const context = await browser.newContext();

            const page = await context.newPage();

            const endpoints = new Map();
            const headers = new Map();

            page.on("request", request => {
              const type = request.resourceType();

              if (type !== "xhr" && type !== "fetch") {
                return;
              }

              const url = request.url();

              endpoints.set(url, {
                url,
                method: request.method(),
                resourceType: type
              });

              headers.set(url, {
                url,
                method: request.method(),
                headers: sanitize(request.headers())
              });

              console.log(
                request.method(),
                type,
                url
              );
            });

            page.on("requestfailed", request => {
              console.log(
                "REQUEST FAILED:",
                request.url(),
                request.failure()?.errorText || ""
              );
            });

            await page.goto(TARGET, {
              waitUntil: "domcontentloaded",
              timeout: 30000
            });

            // Wait for JavaScript/network activity.
            await page.waitForTimeout(10000);

            fs.writeFileSync(
              "endpoints.json",
              JSON.stringify(
                [...endpoints.values()],
                null,
                2
              )
            );

            fs.writeFileSync(
              "headers.json",
              JSON.stringify(
                [...headers.values()],
                null,
                2
              )
            );

            console.log(
              `Captured ${endpoints.size} XHR/fetch requests.`
            );

            await browser.close();
          }

          main().catch(error => {
            console.error(error);
            process.exit(1);
          });
          EOF

      - name: Run capture
        run: node capture.js

      - name: Show generated files
        run: |
          echo "===== endpoints.json ====="
          cat endpoints.json

          echo "===== headers.json ====="
          cat headers.json

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add endpoints.json headers.json

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          git commit -m "Update captured API endpoints"
          git push
