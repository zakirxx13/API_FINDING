name: Discover API Endpoints

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Authorized website URL"
        required: true
        type: string

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest

    steps:
      # -----------------------------
      # 1. Checkout repository
      # -----------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------
      # 2. Setup Node.js
      # -----------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # -----------------------------
      # 3. Install Playwright
      # -----------------------------
      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      # -----------------------------
      # 4. Capture API requests
      # -----------------------------
      - name: Capture network API calls
        env:
          TARGET: ${{ inputs.target }}
        run: |
          cat > capture.js <<'EOF'
          const { chromium } = require("playwright");
          const fs = require("fs");

          (async () => {
            const target = process.env.TARGET;

            if (!target) {
              throw new Error("TARGET is required.");
            }

            if (!/^https?:\/\//i.test(target)) {
              throw new Error(
                "TARGET must be a valid HTTP or HTTPS URL."
              );
            }

            const browser = await chromium.launch({
              headless: true
            });

            const context = await browser.newContext();

            const page = await context.newPage();

            const requests = new Map();

            // Capture XHR and Fetch requests
            page.on("request", request => {
              const resourceType = request.resourceType();

              if (
                resourceType === "xhr" ||
                resourceType === "fetch"
              ) {
                const url = request.url();

                if (!requests.has(url)) {
                  requests.set(url, {
                    url: url,
                    method: request.method(),
                    resourceType: resourceType
                  });
                }
              }
            });

            console.log(`Opening: ${target}`);

            try {
              await page.goto(target, {
                waitUntil: "domcontentloaded",
                timeout: 30000
              });
            } catch (error) {
              console.log(
                `Navigation warning: ${error.message}`
              );
            }

            // Wait for JavaScript/API requests
            await page.waitForTimeout(5000);

            const endpoints = Array.from(requests.values());

            // Create endpoints.json
            fs.writeFileSync(
              "endpoints.json",
              JSON.stringify(endpoints, null, 2),
              "utf8"
            );

            console.log(
              `Captured ${endpoints.length} API endpoints.`
            );

            console.log(
              JSON.stringify(endpoints, null, 2)
            );

            await browser.close();
          })();
          EOF

          node capture.js

      # -----------------------------
      # 5. Show generated file
      # -----------------------------
      - name: Show endpoints.json
        run: |
          echo "===== endpoints.json ====="
          cat endpoints.json

      # -----------------------------
      # 6. Configure Git
      # -----------------------------
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # -----------------------------
      # 7. Commit endpoints.json
      # -----------------------------
      - name: Commit endpoints.json
        run: |
          git add endpoints.json

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          git commit -m "Update API endpoints"

      # -----------------------------
      # 8. Push to repository
      # -----------------------------
      - name: Push changes
        run: |
          git push

      # -----------------------------
      # 9. Upload artifact
      # -----------------------------
      - name: Upload endpoints.json
        uses: actions/upload-artifact@v4
        with:
          name: api-endpoints
          path: endpoints.json
