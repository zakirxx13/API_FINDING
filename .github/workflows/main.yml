name: Capture Authorized API

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Create temporary session
        env:
          AUTH_D: ${{ secrets.AUTH_D }}
        run: |
          printf '%s' "$AUTH_D" > storage-state.json

      - name: Create capture script
        env:
          TARGET: "https://toffeelive.com/en/watch/wHLVIJ4B7a1HdMSjaGLJ"
        run: |
          cat > capture.js <<'EOF'
          const { chromium } = require("playwright");
          const fs = require("fs");

          const sensitive = new Set([
            "authorization",
            "cookie",
            "set-cookie",
            "proxy-authorization",
            "x-api-key",
            "x-auth-token"
          ]);

          function sanitize(headers) {
            return Object.fromEntries(
              Object.entries(headers).map(([key, value]) => [
                key,
                sensitive.has(key.toLowerCase())
                  ? "[REDACTED]"
                  : value
              ])
            );
          }

          (async () => {
            const browser = await chromium.launch({
              headless: true
            });

            const context = await browser.newContext({
              storageState: "storage-state.json"
            });

            const page = await context.newPage();

            const endpoints = new Map();
            const headers = new Map();

            page.on("request", request => {
              const type = request.resourceType();

              if (type !== "xhr" && type !== "fetch") return;

              const url = request.url();

              endpoints.set(url, {
                url,
                method: request.method(),
                resourceType: type
              });

              headers.set(url, {
                url,
                method: request.method(),
                headers: sanitize(request.headers())
              });
            });

            await page.goto(process.env.TARGET, {
              waitUntil: "domcontentloaded",
              timeout: 30000
            });

            await page.waitForTimeout(7000);

            fs.writeFileSync(
              "endpoints.json",
              JSON.stringify([...endpoints.values()], null, 2)
            );

            fs.writeFileSync(
              "headers.json",
              JSON.stringify([...headers.values()], null, 2)
            );

            await browser.close();
          })();
          EOF

          node capture.js

      - name: Delete session
        if: always()
        run: rm -f storage-state.json

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add endpoints.json headers.json

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit -m "Update API endpoint data"
          git push
