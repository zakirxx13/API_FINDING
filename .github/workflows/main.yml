name: API Endpoint Finder

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Authorized website URL"
        required: true
        type: string

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Verify AUTH_D
        env:
          AUTH_D: ${{ secrets.AUTH_D }}
        run: |
          if [ -z "$AUTH_D" ]; then
            echo "AUTH_D is empty or unavailable."
            exit 1
          fi

          echo "AUTH_D secret is available."
          echo "Token value will not be printed."

      - name: Create capture script
        env:
          TARGET: ${{ inputs.target }}
        run: |
          cat > capture.js <<'EOF'
          const { chromium } = require("playwright");
          const fs = require("fs");

          const sensitive = new Set([
            "authorization",
            "cookie",
            "set-cookie",
            "proxy-authorization",
            "x-api-key",
            "x-auth-token"
          ]);

          function sanitize(headers) {
            const output = {};

            for (const [key, value] of Object.entries(headers)) {
              output[key] =
                sensitive.has(key.toLowerCase())
                  ? "[REDACTED]"
                  : value;
            }

            return output;
          }

          async function main() {
            const browser = await chromium.launch({
              headless: true
            });

            const context = await browser.newContext();
            const page = await context.newPage();

            const endpoints = new Map();
            const headers = new Map();

            page.on("request", request => {
              const type = request.resourceType();

              if (type !== "xhr" && type !== "fetch") {
                return;
              }

              const url = request.url();

              endpoints.set(url, {
                url: url,
                method: request.method(),
                resourceType: type
              });

              headers.set(url, {
                url: url,
                method: request.method(),
                headers: sanitize(request.headers())
              });
            });

            console.log("Opening authorized target...");

            await page.goto(process.env.TARGET, {
              waitUntil: "domcontentloaded",
              timeout: 30000
            });

            await page.waitForTimeout(7000);

            fs.writeFileSync(
              "endpoints.json",
              JSON.stringify(
                [...endpoints.values()],
                null,
                2
              )
            );

            fs.writeFileSync(
              "headers.json",
              JSON.stringify(
                [...headers.values()],
                null,
                2
              )
            );

            console.log(
              `Captured ${endpoints.size} XHR/fetch requests.`
            );

            await browser.close();
          }

          main().catch(error => {
            console.error(error);
            process.exit(1);
          });
          EOF

      - name: Run capture
        run: node capture.js

      - name: Delete temporary script
        if: always()
        run: rm -f capture.js

      - name: Commit JSON files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add endpoints.json headers.json

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit -m "Update API endpoints"
          git push
